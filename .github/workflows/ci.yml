name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Lint, build, and test
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.2
    with:
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      pre_command: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup default stable
      format_command: cargo fmt --all -- --check
      lint_command: cargo clippy --workspace --all-targets -- -D warnings
      typecheck_command: bun run typecheck
      build_command: cargo build --workspace && bun run build
      unit_test_command: cargo test --workspace
      cache_cargo: true
      bun_cache_dependency_path: bun.lock
      cargo_cache_dependency_path: Cargo.lock

  performance-validation:
    name: Benchmark
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1.2
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      pre_command: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup toolchain install stable --profile minimal
        rustup default stable
      build_command: cargo build --release -p moonlight-cli
      benchmark_command: |
        python3 scripts/moonlight-cli-benchmark.py \
          --bin target/release/moonlight-cli \
          --warmup 2 \
          --requests 10 \
          --scenario match \
          --scenario candidate-diff \
          --scenario noise \
          --output-dir performance-results/moonlight-cli-benchmark
      summary_paths: performance-results/moonlight-cli-benchmark/latest.md
      artifact_paths: performance-results/moonlight-cli-benchmark/latest.*
      upload_artifacts_on: always
      artifact_name_suffix: -moonlight-cli
      cache_bun: false
      cache_cargo: true
      cargo_cache_dependency_path: Cargo.lock
