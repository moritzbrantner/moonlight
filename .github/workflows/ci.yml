name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test and benchmark smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build moonlight-cli release binary
        run: cargo build --release -p moonlight-cli

      - name: Run moonlight-cli benchmark smoke
        run: |
          python3 scripts/moonlight-cli-benchmark.py \
            --bin target/release/moonlight-cli \
            --warmup 2 \
            --requests 10 \
            --scenario match \
            --scenario candidate-diff \
            --scenario noise \
            --output-dir "$RUNNER_TEMP/moonlight-cli-benchmark"

      - name: Upload moonlight-cli benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-cli-benchmark
          path: ${{ runner.temp }}/moonlight-cli-benchmark/latest.*
