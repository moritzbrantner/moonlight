name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Lint, build, and test
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.2
    with:
      node_version: ""
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      pre_command: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup default stable
      format_command: cargo fmt --all -- --check
      lint_command: cargo clippy --workspace --all-targets -- -D warnings
      typecheck_command: python3 scripts/validate-agent-contracts.py && bun run typegen:check && bun run typecheck
      build_command: cargo build --workspace && bun run build && bun run storybook:build
      unit_test_command: cargo test --workspace && bun run test:run
      cache_cargo: true
      bun_cache_dependency_path: bun.lock
      cargo_cache_dependency_path: Cargo.lock

  performance-validation:
    name: Benchmark
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1.2
    with:
      node_version: ""
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      pre_command: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup toolchain install stable --profile minimal
        rustup default stable
      build_command: cargo build --release -p moonlight-cli
      benchmark_command: |
        python3 scripts/moonlight-cli-benchmark.py \
          --bin target/release/moonlight-cli \
          --warmup 2 \
          --requests 10 \
          --scenario match \
          --scenario candidate-diff \
          --scenario noise \
          --output-dir performance-results/moonlight-cli-benchmark
      unlighthouse_command: scripts/ui-unlighthouse.sh
      summary_paths: |
        performance-results/moonlight-cli-benchmark/latest.md
        performance-results/unlighthouse-summary.md
      artifact_paths: |
        performance-results/moonlight-cli-benchmark/latest.*
        performance-results/unlighthouse
        performance-results/unlighthouse-summary.md
      upload_artifacts_on: always
      artifact_name_suffix: -moonlight
      cache_bun: true
      cache_cargo: true
      bun_cache_dependency_path: bun.lock
      cargo_cache_dependency_path: Cargo.lock

  security-validation:
    name: Dependency security policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Rust advisory check
        run: cargo audit

      - name: Rust dependency policy
        run: cargo deny check
