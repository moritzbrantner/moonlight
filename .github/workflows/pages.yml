name: Pages

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build or reuse Pages artifact
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@2ec97db0aa1a3bcd2f664af0b0d69bef8bab578f
    with:
      source_sha: ${{ github.sha }}
      artifact_key: moonlight-pages-v1
      node_version: ""
      bun_version: "1.3.14"
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      setup_command: bun install --frozen-lockfile
      build_command: VITE_MOONLIGHT_DEMO=true VITE_MOONLIGHT_BASE_PATH=/moonlight/ bun run build
      artifact_paths: apps/moonlight-ui/dist
      reuse_across_runs: true
      timeout_minutes: 10
      artifact_retention_days: 7

  deploy-pages:
    needs: build-pages
    name: Deploy GitHub Pages example
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@2ec97db0aa1a3bcd2f664af0b0d69bef8bab578f
    with:
      node_version: ""
      bun_version: ""
      install_command: ""
      build_command: ""
      artifact_path: apps/moonlight-ui/dist
      prebuilt_artifact_run_id: ${{ needs.build-pages.outputs.producer_run_id }}
      prebuilt_artifact_receipt_name: ${{ needs.build-pages.outputs.receipt_artifact_name }}
      prebuilt_artifact_name: ${{ needs.build-pages.outputs.artifact_name }}
      prebuilt_artifact_digest: ${{ needs.build-pages.outputs.artifact_digest }}
      prebuilt_source_sha: ${{ needs.build-pages.outputs.source_sha }}
      prebuilt_artifact_key: ${{ needs.build-pages.outputs.artifact_key }}
      prebuilt_identity_digest: ${{ needs.build-pages.outputs.identity_digest }}
      timeout_minutes: 10
      cache_bun: false
      cache_node: false
      concurrency_group: pages
      cancel_in_progress: false
