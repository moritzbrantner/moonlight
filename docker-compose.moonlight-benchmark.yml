services:
  primary:
    build:
      context: .
      dockerfile: Dockerfile.moonlight
    image: moonlight-benchmark:latest
    command: moonlight-demo-services primary
    volumes: []

  candidate:
    image: moonlight-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile.moonlight
    command: moonlight-demo-services candidate
    volumes: []

  secondary:
    image: moonlight-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile.moonlight
    command: moonlight-demo-services secondary
    volumes: []

  moonlight-http:
    image: moonlight-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile.moonlight
    command:
      - moonlight-http
      - --primary-url
      - http://primary:3001
      - --candidate-url
      - http://candidate:3002
      - --secondary-url
      - http://secondary:3003
      - --response-timing
      - return-selected
      - --storage-path
      - /workspace/data/moonlight/benchmark-runs.jsonl
    volumes:
      - .:/workspace
