services:
  primary:
    build:
      context: .
      dockerfile: Dockerfile.shadowdiff
    image: moonlight-shadowdiff-benchmark:latest
    command: shadowdiff-demo-services primary
    volumes: []

  candidate:
    image: moonlight-shadowdiff-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile.shadowdiff
    command: shadowdiff-demo-services candidate
    volumes: []

  secondary:
    image: moonlight-shadowdiff-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile.shadowdiff
    command: shadowdiff-demo-services secondary
    volumes: []

  moonlight-http:
    image: moonlight-shadowdiff-benchmark:latest
    build:
      context: .
      dockerfile: Dockerfile.shadowdiff
    command: moonlight-http
    environment:
      SHADOWDIFF_RESPONSE_MODE: primary_then_shadow
      SHADOWDIFF_STORAGE_PATH: /workspace/data/shadowdiff/benchmark-requests.jsonl
    volumes:
      - .:/workspace
