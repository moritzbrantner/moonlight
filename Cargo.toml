[workspace]
members = [
    "crates/moonlight-cli",
    "crates/moonlight-core",
    "crates/moonlight-http",
    "examples/moonlight-demo-services",
]
resolver = "2"

[workspace.package]
edition = "2021"
homepage = "https://moritzbrantner.github.io/moonlight/?page=overview"
license = "MIT"
readme = "README.md"
repository = "https://github.com/moritzbrantner/moonlight"
rust-version = "1.87"
version = "0.1.2"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "no-serde-warnings", "uuid-impl"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
